name: Publish new package version

on:
  push:
    # On version pushes
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+'

  workflow_dispatch:

jobs:
  verify-checks:
    uses: ./.github/workflows/quality-assurance.yaml

  publish:
    name: Build and publish Python Package
    needs: verify-checks
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    environment: release

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version-file: "pyproject.toml"

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          activate-environment: true
          enable-cache: true

      - name: Synchronise dependencies
        run: |
          uv pip install hatchling hatch-vcs

      - name: Verify release version
        shell: bash
        run: |
          VERSION="$(hatchling version)"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ && ! "$VERSION" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Expected a pure release version, got: $VERSION"
            exit 1
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Build package
        run: |
          uv build

      - name: Publish package to PyPI
        run: |
          uv publish

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ env.VERSION }}
        run: |
          gh release create "v$VERSION" \
            --generate-notes --verify-tag \
            ./dist/*.tar.gz ./dist/*.whl
